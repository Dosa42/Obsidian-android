name: Android Dynamic Release Builder & Healer

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Custom Build Version (e.g. v1.2.0, v2.0.0 or auto)'
        required: false
        default: 'auto'
      build_type:
        description: 'Build Type (release or debug)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      clean_build:
        description: 'Run clean task before building'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-heal:
    name: Build & Auto-Heal (${{ github.run_number }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Step 1: Checkout repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Dynamic Semantic Version Calculation
      - name: 🏷️ Calculate Dynamic Build Version & Unique Identity
        id: versioning
        run: |
          echo "=========================================================="
          echo "Calculating dynamic build version..."
          echo "=========================================================="
          
          INPUT_VER="${{ github.event.inputs.version_name }}"
          RUN_NUM=${{ github.run_number }}
          RUN_ATTEMPT=${{ github.run_attempt }}
          
          if [ -n "$INPUT_VER" ] && [ "$INPUT_VER" != "auto" ]; then
            BUILD_VER="$INPUT_VER"
          else
            # Dynamic semantic versioning algorithm:
            # Run 1..9   -> v1.1.0 .. v1.9.0
            # Run 10..19 -> v2.0.0 .. v2.9.0
            # Run 20..29 -> v3.0.0 .. v3.9.0, etc.
            MAJOR_VER=$(( (RUN_NUM / 10) + 1 ))
            MINOR_VER=$(( RUN_NUM % 10 ))
            PATCH_VER=$(( RUN_ATTEMPT - 1 ))
            BUILD_VER="v${MAJOR_VER}.${MINOR_VER}.${PATCH_VER}"
          fi
          
          # Unique timestamp identifier for this build
          BUILD_TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          BUILD_CODE=$(( 1000 + RUN_NUM ))
          
          echo "BUILD_VERSION=${BUILD_VER}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_CODE}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> $GITHUB_ENV
          echo "SELECTED_BUILD_TYPE=${{ github.event.inputs.build_type || 'release' }}" >> $GITHUB_ENV
          
          echo "✅ Calculated Dynamic Version: ${BUILD_VER}"
          echo "✅ Version Code: ${BUILD_CODE}"
          echo "✅ Build Timestamp: ${BUILD_TIMESTAMP}"

      # Step 3: Setup Java using setup-java v5
      - name: ☕ Setup Java Development Kit (actions/setup-java@v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Step 4: Setup Gradle using latest stable gradle action v4
      - name: 🐘 Setup Latest Stable Gradle Action (setup-gradle@v4)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Step 5: Live Runtime Self-Healing & Environment Preparation
      - name: 🩺 Live Runtime Self-Healing & Environment Diagnostic
        id: heal_environment
        run: |
          echo "=========================================================="
          echo "Running Live Self-Healing & Environment Preparation..."
          echo "=========================================================="
          
          # 1. Self-heal Gradle Wrapper if missing or unexecutable
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ gradlew wrapper missing! Generating wrapper dynamically..."
            if command -v gradle &> /dev/null; then
              gradle wrapper --gradle-version 9.3.1
            else
              echo "Downloading standalone gradle to heal wrapper..."
              wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
              unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
              /tmp/gradle-dist/gradle-9.3.1/bin/gradle wrapper
            fi
          fi
          chmod +x ./gradlew
          echo "✅ gradlew healed and executable."
          
          # 2. Self-heal Android SDK Licenses
          if [ -n "$ANDROID_HOME" ]; then
            echo "Accepting Android SDK licenses..."
            mkdir -p "$ANDROID_HOME/licenses" || true
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi
          
          # 3. Self-heal google-services.json if missing (prevent Google Services Plugin crash)
          if [ ! -f "app/google-services.json" ]; then
            echo "⚠️ app/google-services.json missing! Generating non-breaking placeholder..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "obsidian-vault-dynamic",
              "storage_bucket": "obsidian-vault-dynamic.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.aistudio.obsidianvault.kxvnq"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyPlaceholderDummyApiKeyForBuildCompliance000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "✅ Created app/google-services.json placeholder."
          fi
          
          # 4. Self-heal .env configuration for secrets plugin
          if [ ! -f ".env" ]; then
            echo "Creating fallback .env configuration..."
            echo 'GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY || "" }}"' > .env
            echo "✅ .env initialized."
          fi
          
          # 5. Stable & Consistent Release Keystore Setup (Alias 'upload' strictly matching app/build.gradle.kts)
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          KEY_PASS="${{ secrets.KEYSTORE_PASSWORD || 'obsidianvault' }}"
          
          if [ ! -f "$KEYSTORE_FILE" ]; then
            if [ -f "${GITHUB_WORKSPACE}/my-upload-key.base64" ]; then
              echo "Restoring stable upload keystore from my-upload-key.base64..."
              base64 -d "${GITHUB_WORKSPACE}/my-upload-key.base64" > "$KEYSTORE_FILE"
            elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
              echo "Restoring stable upload keystore from GitHub Secret RELEASE_KEYSTORE_BASE64..."
              echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            else
              echo "🔐 Generating stable release keystore with alias 'upload'..."
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_FILE" \
                -alias "upload" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$KEY_PASS" \
                -keypass "$KEY_PASS" \
                -dname "CN=Obsidian Vault, OU=Mobile, O=AI Studio, L=Amsterdam, ST=NH, C=NL"
            fi
            echo "✅ Release keystore ready: $KEYSTORE_FILE"
          else
            echo "✅ Using existing repository release keystore: $KEYSTORE_FILE"
          fi
          
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          
          # 6. Optimize Gradle Memory & Daemon Settings
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.vfs.watch=false
          android.useAndroidX=true
          EOF
          echo "✅ Gradle memory parameters tuned."

      # Step 6: Execute Build with Adaptive Live Error Recovery
      - name: 🔨 Build Android APK (${{ env.SELECTED_BUILD_TYPE }})
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          CI: true
        run: |
          echo "=========================================================="
          echo "Building ${SELECTED_BUILD_TYPE} APK for version ${BUILD_VERSION}..."
          echo "Using Keystore: ${KEYSTORE_PATH} (Alias: upload)"
          echo "=========================================================="
          
          BUILD_TASK="assembleRelease"
          if [ "${SELECTED_BUILD_TYPE}" = "debug" ]; then
            BUILD_TASK="assembleDebug"
          fi
          
          CLEAN_FLAG=""
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            CLEAN_FLAG="clean"
          fi
          
          # First build attempt with non-interactive flags and explicit signing parameters
          echo "Starting primary build attempt..."
          if ./gradlew $CLEAN_FLAG $BUILD_TASK --stacktrace --no-daemon \
             -Pandroid.injected.version.code="${BUILD_NUMBER}" \
             -Pandroid.injected.version.name="${BUILD_VERSION}" \
             -Pandroid.injected.signing.store.file="${KEYSTORE_PATH}" \
             -Pandroid.injected.signing.store.password="${STORE_PASSWORD}" \
             -Pandroid.injected.signing.key.alias="upload" \
             -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"; then
            echo "✅ Primary build attempt succeeded!"
          else
            echo "⚠️ Primary build encountered an error! Initiating Live Self-Healing Recovery..."
            
            # Heal dependencies, stop any hanging daemons, refresh caches
            ./gradlew --stop || true
            sleep 2
            
            echo "Running heal recovery with refreshed dependencies..."
            ./gradlew $BUILD_TASK --refresh-dependencies --stacktrace --no-daemon \
               -Pandroid.injected.version.code="${BUILD_NUMBER}" \
               -Pandroid.injected.version.name="${BUILD_VERSION}" \
               -Pandroid.injected.signing.store.file="${KEYSTORE_PATH}" \
               -Pandroid.injected.signing.store.password="${STORE_PASSWORD}" \
               -Pandroid.injected.signing.key.alias="upload" \
               -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"
            
            echo "✅ Self-healing build completed successfully!"
          fi

      # Step 7: Dynamic APK Renaming & Integrity Verification
      - name: 📦 Prepare and Rename Output APK
        id: package_apk
        run: |
          echo "=========================================================="
          echo "Locating and renaming output APK..."
          echo "=========================================================="
          
          OUTPUT_DIR="app/build/outputs/apk/${SELECTED_BUILD_TYPE}"
          FOUND_APK=$(find "$OUTPUT_DIR" -name "*.apk" | head -n 1)
          
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            # Search entire app/build for any generated apk
            FOUND_APK=$(find "app/build" -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "❌ Error: Could not locate built APK in output directory!"
            exit 1
          fi
          
          DIST_DIR="${GITHUB_WORKSPACE}/distribution"
          mkdir -p "$DIST_DIR"
          
          # Target dynamic filename requested: e.g. ObsidianVault-v1.2.0-release.apk
          TARGET_APK_NAME="ObsidianVault-${BUILD_VERSION}-${SELECTED_BUILD_TYPE}.apk"
          FINAL_APK_PATH="${DIST_DIR}/${TARGET_APK_NAME}"
          
          cp "$FOUND_APK" "$FINAL_APK_PATH"
          
          # Calculate SHA-256 Checksum for verification
          SHA256_HASH=$(sha256sum "$FINAL_APK_PATH" | awk '{print $1}')
          APK_SIZE_BYTES=$(stat -c%s "$FINAL_APK_PATH")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE_BYTES / 1048576" | bc)
          
          echo "APK_FILE_PATH=${FINAL_APK_PATH}" >> $GITHUB_ENV
          echo "APK_FILE_NAME=${TARGET_APK_NAME}" >> $GITHUB_ENV
          echo "APK_SHA256=${SHA256_HASH}" >> $GITHUB_ENV
          echo "APK_SIZE_MB=${APK_SIZE_MB}" >> $GITHUB_ENV
          
          echo "=========================================================="
          echo "🎉 APK Ready for Deployment:"
          echo "📁 Name:     ${TARGET_APK_NAME}"
          echo "⚖️ Size:     ${APK_SIZE_MB} MB (${APK_SIZE_BYTES} bytes)"
          echo "🔒 SHA-256:  ${SHA256_HASH}"
          echo "=========================================================="

      # Step 8: Upload Artifact to GitHub Actions Runner
      - name: 🚀 Upload Artifact (actions/upload-artifact@v4)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE_NAME }}
          path: ${{ env.APK_FILE_PATH }}
          if-no-files-found: error
          retention-days: 30

      # Step 9: Automatic GitHub Release on Tag or Main Branch Push
      - name: 🌟 Create Automated GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: "Obsidian Vault ${{ env.BUILD_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📱 Obsidian Vault Android Build `${{ env.BUILD_VERSION }}`
            
            - **Build Number**: `${{ env.BUILD_NUMBER }}`
            - **Timestamp**: `${{ env.BUILD_TIMESTAMP }}`
            - **Build Type**: `${{ env.SELECTED_BUILD_TYPE }}`
            - **Package**: `com.aistudio.obsidianvault.kxvnq`
            - **APK Name**: `${{ env.APK_FILE_NAME }}`
            - **File Size**: `${{ env.APK_SIZE_MB }} MB`
            - **SHA-256 Checksum**:
              ```
              ${{ env.APK_SHA256 }}
              ```
            
            Built with adaptive self-healing CI/CD on JDK 21 and Gradle 9.3.1.
          files: |
            ${{ env.APK_FILE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
